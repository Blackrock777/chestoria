name: CheStoria
options:
  bundleIdPrefix: app.chestoria
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 4HDA7QAGZ3
    CODE_SIGN_STYLE: Automatic
targets:
  CheStoria:
    type: application
    platform: iOS
    sources:
      - path: CheStoria
        excludes:
          - "Resources/Fonts/*.txt"
          - "Resources/ML/*.txt"
          - "Resources/ML/*.md"
          - "Resources/Content"
      - path: CheStoria/Resources/Content
        type: folder
        buildPhase: resources
      - path: Shared
    dependencies:
      - target: CheStoriaWidgets
    entitlements:
      path: CheStoria/CheStoria.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.security.application-groups: [group.app.chestoria]
    info:
      path: CheStoria/Info.plist
      properties:
        CFBundleDisplayName: CheStoria
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts:
          - BricolageGrotesque-ExtraBold.ttf
          - BricolageGrotesque-Bold.ttf
          - Kalam-Bold.ttf
        NSCameraUsageDescription: CheStoria uses the camera so you can point at a place and get its story.
        NSLocationWhenInUseUsageDescription: CheStoria uses your location to know which place you are looking at, so you never have to search.
        ContentBaseURL: ""
        SupabaseURL: ""
        SupabaseAnonKey: ""
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: app.chestoria
            CFBundleURLSchemes: [chestoria]
        CFBundleLocalizations: [en, it, fr, de, es]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.chestoria.CheStoria
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Tufo
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
  CheStoriaWidgets:
    type: app-extension
    platform: iOS
    sources: [CheStoriaWidgets, Shared]
    info:
      path: CheStoriaWidgets/Info.plist
      properties:
        CFBundleDisplayName: CheStoria
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: CheStoriaWidgets/CheStoriaWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.app.chestoria]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.chestoria.CheStoria.Widgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  CheStoriaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CheStoriaTests
        excludes: ["Fixtures"]
      - path: CheStoriaTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: CheStoria
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CheStoria:
    build:
      targets:
        CheStoria: all
        CheStoriaTests: [test]
    test:
      targets: [CheStoriaTests]
